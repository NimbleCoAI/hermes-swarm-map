name: person_memory
version: "0.3.0"
description: >-
  Person-based adaptive memory. Recognizes the current sender by platform user
  id and, via pre_llm_call, appends a short adaptation directive (technical
  depth + communication style) to the user message so the agent meets each
  person where they are — while keeping every fact and the shared context
  identical for everyone. Profiles live at
  memories/people/<platform>:<id>.md.
  The card set maintains ITSELF: a sender is auto-seeded on first contact from
  observed platform facts only (display name, id forms, dates — nothing about
  them is inferred), id aliases are learned from interaction because
  pre_llm_call supplies both forms per turn (Signal carries a phone number AND
  an ACI UUID), and the agent records what it learns about communicating with
  someone through the remember_person tool. No hand-written frontmatter, no
  admin configuration. Never touches the system prompt, strictly fail-open.
  NOTE: the directive is built only from display_name/role/technical_level/
  comm_style and the first lines of "## Notable context", which are echoed
  verbatim — and in shared group sessions are visible to everyone. Raw
  identifiers are rejected from those fields; the matching ids live in the
  FILENAME and the non-injected alias_ids field, never in the injected text.
  Set PERSON_MEMORY_READONLY=1 to keep adaptation but disable all writes;
  PERSON_MEMORY_DISABLED=1 turns the plugin off entirely.
author: NimbleCo
hooks:
  - pre_llm_call
  - pre_gateway_dispatch
tools:
  - remember_person
